<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071827">
<title>MADHYUM GROUP CRM Login</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 8%,rgba(41,83,112,.40),transparent 34%),linear-gradient(155deg,#102b40 0%,#071827 48%,#04111d 100%);color:#fff}.shell{width:min(430px,100%)}.top{text-align:center;font-size:8px;letter-spacing:3.2px;font-weight:800;color:#d7e0e6;margin:0 0 14px}.top i{display:inline-block;width:16px;height:1px;background:#d9ad4a;vertical-align:middle;margin:0 8px}.panel{border:1px solid rgba(113,149,173,.52);border-radius:26px;padding:25px 22px 21px;background:linear-gradient(180deg,rgba(10,31,48,.95),rgba(5,20,33,.98));box-shadow:0 28px 80px rgba(0,0,0,.38)}.brand{text-align:center;color:#efd078;font-size:14px;font-weight:900;letter-spacing:3px;margin-top:4px}.crm{text-align:center;font-family:Georgia,serif;font-size:34px;letter-spacing:8px;font-weight:800;margin:7px 0 4px}.sub{text-align:center;color:#d5dfe5;font-size:11.5px;margin:0 0 18px}.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid #49677d;border-radius:12px;overflow:hidden;margin-bottom:18px;background:#0c2437}.tabs button{min-height:44px;border:0;background:transparent;color:#c8d4dc;font-weight:800;font-size:12px;cursor:pointer}.tabs button.active{background:linear-gradient(135deg,#efd078,#dcae43);color:#071827}.label{display:block;font-size:9.5px;font-weight:900;letter-spacing:.55px;margin:12px 0 6px}.input{height:45px;display:flex;align-items:center;border:1px solid #4a6d86;background:#0d2940;border-radius:12px;padding:0 12px}.input:focus-within{border-color:#e0b752;box-shadow:0 0 0 3px rgba(224,183,82,.12)}input{border:0;outline:0;background:transparent;color:#fff;width:100%;font-size:12px}input::placeholder{color:#9fb1bd}.pw{border:0;background:transparent;color:#dce5ea;cursor:pointer;font-size:14px}.btn{width:100%;border:0;border-radius:12px;background:linear-gradient(135deg,#efd078,#dda83b);color:#071827;font-weight:900;padding:14px 16px;margin-top:18px;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.msg{min-height:19px;text-align:center;color:#ffb7af;font-size:10px;font-weight:700;margin-top:9px}.foot{text-align:center;color:#9eb0bc;font-size:8px;letter-spacing:1px;margin-top:16px}.wings{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:11px;color:#d1dbe1;font-size:6.5px;text-align:center}.wings span+span{border-left:1px solid rgba(255,255,255,.12)}
</style>
</head>
<body>
<div class="shell">
  <div class="top">CONNECT <i></i> COLLABORATE <i></i> GROW</div>
  <div class="panel">
    <div class="brand">MADHYUM GROUP</div>
    <div class="crm">CRM</div>
    <p class="sub">One secure login for Admin, BDM and Agent.</p>
    <div class="tabs">
      <button id="agentTab" class="active" type="button">Agent / BDM</button>
      <button id="adminTab" type="button">Admin</button>
    </div>
    <form id="loginForm">
      <label class="label" for="loginId">LOGIN ID / EMAIL</label>
      <div class="input"><input id="loginId" autocomplete="username" placeholder="Enter Agent / BDM ID" required></div>
      <label class="label" for="password">PASSWORD</label>
      <div class="input"><input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required><button class="pw" id="showPw" type="button" aria-label="Show password">◉</button></div>
      <button class="btn" id="loginButton" type="submit">Login →</button>
      <div class="msg" id="message" aria-live="polite"></div>
    </form>
    <div class="foot">PEOPLE • OPPORTUNITIES • PROGRESS</div>
    <div class="wings"><span>REAL ESTATE</span><span>TRAVEL</span><span>ADMISSION</span><span>CONSULTANCY</span><span>EVENTS</span></div>
  </div>
</div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycby1axGjQXJHFYlsvPK4O9hW-oETEKNz7nQy9pS-jkGiKE6e14ogG3oAOY1ZM0MqKOc/exec';
let loginType=new URLSearchParams(location.search).get('role')==='admin'?'admin':'agent';
const $=id=>document.getElementById(id);
function setType(type){loginType=type;$('agentTab').classList.toggle('active',type==='agent');$('adminTab').classList.toggle('active',type==='admin');$('loginId').placeholder=type==='admin'?'Enter Admin ID':'Enter Agent / BDM ID';$('message').textContent=''}
$('agentTab').onclick=()=>setType('agent');$('adminTab').onclick=()=>setType('admin');setType(loginType);
$('showPw').onclick=()=>{$('password').type=$('password').type==='password'?'text':'password'};
$('loginForm').onsubmit=async e=>{e.preventDefault();const btn=$('loginButton'),id=$('loginId').value.trim().toUpperCase(),password=$('password').value;if(!id||!password)return;$('message').textContent='';btn.disabled=true;btn.textContent='Signing in…';try{const action=loginType==='admin'?'adminLogin':'agentLogin';const payload=loginType==='admin'?{adminId:id,password}:{agentId:id,password};const r=await fetch(API_URL+'?action='+encodeURIComponent(action)+'&_='+Date.now(),{method:'POST',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const text=await r.text();let data;try{data=JSON.parse(text)}catch(_){throw new Error('Server response error. Please try again.')}if(!data.success)throw new Error(data.message||'Login failed.');if(loginType==='admin'){sessionStorage.setItem('madhyumAdminToken',data.token);sessionStorage.setItem('madhyumAdminId',data.admin?.adminId||id);sessionStorage.setItem('madhyumAdminName',data.admin?.name||'Admin');sessionStorage.setItem('madhyumAdminRole',data.admin?.role||'Admin');location.href='../admin/dashboard.html'}else{sessionStorage.setItem('madhyumAgentToken',data.token);sessionStorage.setItem('madhyumAgentId',data.agent?.agentId||id);sessionStorage.setItem('madhyumAgentName',data.agent?.name||'Agent');sessionStorage.setItem('madhyumAgentRole',data.agent?.role||'AGENT');sessionStorage.setItem('madhyumReportingBdmId',data.agent?.reportingBdmId||'');location.href='../agent/dashboard.html'}}catch(err){$('message').textContent=err.message||'Unable to login.'}finally{btn.disabled=false;btn.textContent='Login →'}};
</script>
</body>
</html>
