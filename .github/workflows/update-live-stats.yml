name: Update MADHYUM Live Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read live stats from Apps Script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          BASE_URL="https://script.google.com/macros/s/AKfycbwd5x_8gPAzXMeP4TZPxLQQABisZ6Zn4lmGmzhfUsg83Z4xdnNY2dqb5KdZvRhGm4M/exec"
          TS="$(date +%s)"
          JSONP_URL="${BASE_URL}?action=stats&callback=madhyumStatsCallback&_=${TS}"

          curl             --location             --compressed             --retry 4             --retry-delay 2             --retry-all-errors             --connect-timeout 15             --max-time 60             --silent             --show-error             --user-agent "Mozilla/5.0"             --header "Accept: application/json,text/javascript,*/*;q=0.8"             --header "Cache-Control: no-cache"             --output /tmp/madhyum-stats.txt             "$JSONP_URL"

          python3 - <<'PY'
          import json, datetime, pathlib, re

          raw = pathlib.Path("/tmp/madhyum-stats.txt").read_text(
              encoding="utf-8", errors="replace"
          ).strip()

          m = re.fullmatch(
              r"\s*madhyumStatsCallback\s*\(\s*(\{.*\})\s*\)\s*;?\s*",
              raw,
              flags=re.S,
          )
          if m:
              raw = m.group(1)

          data = json.loads(raw)

          if data.get("success") is not True:
              raise SystemExit("Apps Script returned success != true: " + repr(data))

          clean = {
              "success": True,
              "visitors": max(0, int(data.get("visitors", 0))),
              "inquiries": max(0, int(data.get("inquiries", 0))),
              "updatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }

          out = pathlib.Path("data/stats.json")
          out.write_text(json.dumps(clean, indent=2) + "\n", encoding="utf-8")
          print("Created:", out.resolve())
          print(out.read_text())
          PY

      - name: Force add and commit stats file
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # -f guarantees the new file is added even if a .gitignore rule matches it.
          git add -f data/stats.json

          echo "Staged files:"
          git diff --cached --name-status

          if git diff --cached --quiet; then
            echo "stats.json is already identical to the committed version."
            exit 0
          fi

          git commit -m "Create/update live stats file"
          git push origin HEAD:main
