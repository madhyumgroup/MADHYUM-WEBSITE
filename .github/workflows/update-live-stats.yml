name: Update MADHYUM Live Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: madhyum-live-stats
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Read live stats from Apps Script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          URL="https://script.google.com/macros/s/AKfycbzRgbrdHLtZO6MB-WjazHCqHfQtVEeANQHrCet1Ag/exec?action=stats&_=$(date +%s)"
          curl --fail --silent --show-error --location --max-time 30 "$URL" -o /tmp/madhyum-stats.json
          python3 - <<'PY'
          import json, datetime, pathlib
          p=pathlib.Path('/tmp/madhyum-stats.json')
          data=json.loads(p.read_text())
          if data.get('success') is not True:
              raise SystemExit('Apps Script returned success != true')
          visitors=int(data.get('visitors',0))
          inquiries=int(data.get('inquiries',0))
          clean={
              'success': True,
              'visitors': max(0, visitors),
              'inquiries': max(0, inquiries),
              'updatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('data/stats.json').write_text(json.dumps(clean,indent=2)+'\n')
          print(clean)
          PY

      - name: Commit updated stats if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/stats.json; then
            echo "No statistics change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git commit -m "Update live website statistics"
          git push
