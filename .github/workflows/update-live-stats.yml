name: Update MADHYUM Live Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: madhyum-live-stats
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Read live stats from Apps Script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          BASE_URL="https://script.google.com/macros/s/AKfycbwd5x_8gPAzXMeP4TZPxLQQABisZ6Zn4lmGmzhfUsg83Z4xdnNY2dqb5KdZvRhGm4M/exec"
          TS="$(date +%s)"
          JSONP_URL="${BASE_URL}?action=stats&callback=madhyumStatsCallback&_=${TS}"

          curl             --location             --compressed             --retry 4             --retry-delay 2             --retry-all-errors             --connect-timeout 15             --max-time 60             --silent             --show-error             --user-agent "Mozilla/5.0"             --header "Accept: application/json,text/javascript,*/*;q=0.8"             --header "Cache-Control: no-cache"             --output /tmp/madhyum-stats.txt             "$JSONP_URL"

          python3 - <<'PY'
          import json, datetime, pathlib, re

          raw = pathlib.Path("/tmp/madhyum-stats.txt").read_text(
              encoding="utf-8", errors="replace"
          ).strip()

          m = re.fullmatch(
              r"\s*madhyumStatsCallback\s*\(\s*(\{.*\})\s*\)\s*;?\s*",
              raw,
              flags=re.S,
          )
          if m:
              raw = m.group(1)

          data = json.loads(raw)

          if data.get("success") is not True:
              raise SystemExit("Apps Script returned success != true: " + repr(data))

          clean = {
              "success": True,
              "visitors": max(0, int(data.get("visitors", 0))),
              "inquiries": max(0, int(data.get("inquiries", 0))),
              "updatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }

          pathlib.Path("data/stats.json").write_text(
              json.dumps(clean, indent=2) + "\n",
              encoding="utf-8",
          )

          print("MADHYUM live stats prepared:", clean)
          PY

      - name: Commit updated stats
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # IMPORTANT: git diff does not see a brand-new untracked file.
          # git status --porcelain does, so stats.json will be committed even the first time.
          if [ -z "$(git status --porcelain -- data/stats.json)" ]; then
            echo "No statistics change to commit."
            exit 0
          fi

          git add data/stats.json
          git commit -m "Update live website statistics"
          git push
