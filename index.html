<!-- =====================================================
     MADHYUM C-SHAPE ROTATIONAL HERO
===================================================== -->

<section
  class="c-hero"
  id="hero"
  aria-label="MADHYUM business network"
>

  <!-- FIXED BACKGROUND -->
  <div class="c-hero-background"></div>


  <!-- BRANDING -->

  <div class="c-hero-brand">

    <div class="c-brand-name">
      MADHYUM
    </div>

    <div class="c-brand-tagline">
      Ek Bharosemand Zariya
    </div>

    <h1>
      Your Dreams
      <span>R Network.</span>
    </h1>

  </div>


  <!-- =================================================
       C-SHAPED ORBIT
  ================================================== -->

  <div
    class="c-orbit"
    id="cOrbit"
  >

    <!-- REAL ESTATE -->

    <a
      class="c-wing"
      data-wing="0"
      href="real-estate.html"
      aria-label="Real Estate"
    >

      <div class="c-wing-visual">

        <img
          src="real-estate.png"
          alt="Real Estate"
        >

      </div>

      <div class="c-wing-name">
        REAL ESTATE
      </div>

    </a>


    <!-- TRAVEL -->

    <a
      class="c-wing"
      data-wing="1"
      href="travel.html"
      aria-label="Travel"
    >

      <div class="c-wing-visual">

        <img
          src="travel.png"
          alt="Travel"
        >

      </div>

      <div class="c-wing-name">
        TRAVEL
      </div>

    </a>


    <!-- EDUCATION -->

    <a
      class="c-wing"
      data-wing="2"
      href="education.html"
      aria-label="Education and Admissions"
    >

      <div class="c-wing-visual">

        <img
          src="education.png"
          alt="Education and Admissions"
        >

      </div>

      <div class="c-wing-name">
        EDUCATION &amp; ADMISSIONS
      </div>

    </a>


    <!-- CONSULTANCY -->

    <a
      class="c-wing"
      data-wing="3"
      href="consultancy.html"
      aria-label="Consultancy and Business Services"
    >

      <div class="c-wing-visual">

        <img
          src="consultancy.png"
          alt="Consultancy and Business Services"
        >

      </div>

      <div class="c-wing-name">
        CONSULTANCY &amp; BUSINESS SERVICES
      </div>

    </a>


    <!-- EVENTS -->

    <a
      class="c-wing"
      data-wing="4"
      href="events.html"
      aria-label="Events and Weddings"
    >

      <div class="c-wing-visual">

        <img
          src="events.png"
          alt="Events and Weddings"
        >

      </div>

      <div class="c-wing-name">
        EVENTS &amp; WEDDINGS
      </div>

    </a>

  </div>


  <!-- CONTROLS -->

  <div class="c-controls">

    <button
      id="cPrev"
      class="c-control"
      type="button"
      aria-label="Previous"
    >
      ←
    </button>


    <div
      id="cDots"
      class="c-dots"
    ></div>


    <button
      id="cNext"
      class="c-control"
      type="button"
      aria-label="Next"
    >
      →
    </button>

  </div>

</section>
