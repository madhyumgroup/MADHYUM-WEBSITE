<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MADHYUM Agent Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#0d1726;padding:20px}.login-card{width:100%;max-width:460px;background:#fff;border-radius:20px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.28)}.login-banner-wrap{width:100%;margin-bottom:20px}.login-banner{width:100%;max-height:220px;object-fit:cover;border-radius:14px;display:block}.brand{text-align:center;font-size:26px;font-weight:900;letter-spacing:.14em;color:#0d1726;margin-bottom:7px}.subtitle{text-align:center;color:#667085;font-size:14px;margin-bottom:28px}.field{margin-bottom:16px}label{display:block;margin-bottom:7px;font-size:12px;font-weight:700;color:#344054}input{width:100%;padding:12px 13px;border:1px solid #d9dee5;border-radius:10px;font-size:14px;outline:none;background:#fff}input:focus{border-color:#c9a45b}.login-btn{width:100%;margin-top:6px;border:0;border-radius:10px;padding:13px 16px;background:#c9a45b;color:#111;font-size:14px;font-weight:800;cursor:pointer}.login-btn:disabled{opacity:.6;cursor:not-allowed}.message{min-height:20px;margin-top:14px;text-align:center;font-size:13px;font-weight:700;color:#b42318}
</style>
</head>
<body>
<div class="login-card">
<div class="login-banner-wrap"><img src="../images/admin-login-banner.png" alt="MADHYUM Group" class="login-banner"></div>
<div class="brand">MADHYUM</div><div class="subtitle">Agent / Employee Portal</div>
<form id="loginForm">
<div class="field"><label>Agent / BDM ID</label><input id="agentId" type="text" autocomplete="username" required></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
<button class="login-btn" id="loginButton" type="submit">Login</button><div class="message" id="loginMessage"></div>
</form></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwd5x_8gPAzXMeP4TZPxLQQABisZ6Zn4lmGmzhfUsg83Z4xdnNY2dqb5KdZvRhGm4M/exec";
document.getElementById("loginForm").addEventListener("submit",async function(e){e.preventDefault();const message=document.getElementById("loginMessage"),button=document.getElementById("loginButton"),agentId=document.getElementById("agentId").value.trim().toUpperCase(),password=document.getElementById("password").value;message.textContent="Logging in...";button.disabled=true;try{const response=await fetch(API_URL+"?action=agentLogin&_="+Date.now(),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({agentId,password})});const result=await response.json();if(!result.success)throw new Error(result.message||"Login failed.");sessionStorage.setItem("madhyumAgentToken",result.token);sessionStorage.setItem("madhyumAgentId",result.agent?.agentId||agentId);sessionStorage.setItem("madhyumAgentName",result.agent?.name||"Agent");sessionStorage.setItem("madhyumAgentRole",result.agent?.role||"AGENT");sessionStorage.setItem("madhyumReportingBdmId",result.agent?.reportingBdmId||"");window.location.href="dashboard.html"}catch(error){message.textContent=error.message||"Unable to login."}finally{button.disabled=false}});
</script>
</body></html>
