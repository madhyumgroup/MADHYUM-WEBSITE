<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MADHYUM Agent Dashboard</title>


  <style>
<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fa;
  color:#111827;
  overflow-x:hidden;
}

.shell{
  min-height:100vh;
  display:grid;
  grid-template-columns:240px 1fr;
}

.sidebar{
  background:#0d1726;
  color:#fff;
  padding:24px 18px;
  min-height:100vh;
  position:sticky;
  top:0;
  align-self:start;
}

.brand{
  font-size:22px;
  font-weight:900;
  letter-spacing:.12em;
  margin-bottom:8px;
}

.role{
  font-size:12px;
  color:#aeb8c5;
  margin-bottom:32px;
}

.nav-item{
  display:block;
  width:100%;
  text-align:left;
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:8px;
  color:#d8e0e8;
  background:transparent;
  border:0;
  cursor:pointer;
  font-size:14px;
}

.nav-item.active,
.nav-item:hover{
  background:#18263a;
  color:#fff;
}

.logout{
  margin-top:30px;
  background:#c9a45b;
  color:#111;
  font-weight:800;
}

.sidebar-banner-wrap{
  margin-top:24px;
  text-align:center;
}

.sidebar-banner{
  width:100%;
  border-radius:12px;
  display:block;
  object-fit:cover;
}

.main{
  padding:28px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

.topbar h1{
  margin:0;
  font-size:30px;
}

.agent-name{
  color:#667085;
  font-size:14px;
  margin-top:4px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1.4fr;
  gap:20px;
  align-items:start;
}

.panel{
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 8px 24px rgba(15,23,42,.06);
  scroll-margin-top:25px;
}

.panel h2{
  margin:0 0 18px;
  font-size:20px;
}

.field{
  margin-bottom:14px;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
  color:#344054;
}

input,
select,
textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #d9dee5;
  border-radius:10px;
  font-size:14px;
  background:#fff;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.submit-btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:12px 16px;
  background:#c9a45b;
  color:#111;
  font-weight:800;
  cursor:pointer;
}

.submit-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  min-height:18px;
  margin-top:12px;
  text-align:center;
  font-size:13px;
  font-weight:700;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}

th,
td{
  padding:11px 10px;
  border-bottom:1px solid #eceff3;
  text-align:left;
  font-size:13px;
}

th{
  font-size:11px;
  text-transform:uppercase;
  color:#667085;
}

.status{
  display:inline-block;
  padding:5px 8px;
  border-radius:999px;
  background:#eef2f6;
  font-size:11px;
  font-weight:800;
}

.empty{
  text-align:center;
  padding:24px;
  color:#667085;
}


/* =====================================================
   AGENT DASHBOARD MOBILE
   SINGLE VERTICAL FLOW
   NO HORIZONTAL SCROLL
   ===================================================== */

@media(max-width:900px){

  html,
  body{
    width:100%;
    max-width:100%;
    overflow-x:hidden!important;
  }

  .shell{
    display:block;
    width:100%;
    max-width:100%;
    min-height:100vh;
    overflow-x:hidden;
  }

  .sidebar{
    width:100%;
    max-width:100%;
    min-height:auto;
    position:relative;
    top:auto;
    padding:16px 14px;
    overflow:hidden;
  }

  .brand{
    font-size:18px;
    margin-bottom:5px;
  }

  .role{
    font-size:11px;
    margin-bottom:14px;
  }

  .nav-item{
    display:block;
    width:100%;
    max-width:100%;
    margin:0 0 8px 0;
    padding:10px 12px;
    font-size:12px;
  }

  .logout{
    margin-top:0;
  }

  /* PHOTO DIRECTLY BELOW NAV */

  .sidebar-banner-wrap{
    width:100%;
    max-width:100%;
    margin:12px 0 0;
    padding:0;
    overflow:hidden;
    text-align:center;
  }

  .sidebar-banner{
    display:block;
    width:100%;
    max-width:100%;

    /* HEIGHT = 2X WIDTH */
    aspect-ratio:1 / 2;
    height:auto;

    object-fit:cover;
    object-position:center;

    margin:0;
    border-radius:10px;
  }

  /* MAIN CONTENT */

  .main{
    width:100%;
    max-width:100%;
    padding:16px 14px 28px;
    overflow-x:hidden;
  }

  .topbar{
    display:block;
    margin-bottom:16px;
  }

  .topbar h1{
    font-size:24px;
  }

  .agent-name{
    font-size:12px;
    margin-top:5px;
  }

  .grid{
    display:block;
    width:100%;
    max-width:100%;
  }

  .panel{
    width:100%;
    max-width:100%;
    padding:14px;
    margin-bottom:16px;
    border-radius:12px;
    overflow:hidden;
  }

  .panel h2{
    font-size:18px;
    margin-bottom:14px;
  }

  input,
  select,
  textarea,
  .submit-btn{
    width:100%;
    max-width:100%;
  }

  /* =================================================
     MY LEADS MOBILE CARDS
     NO HORIZONTAL TABLE SLIDER
     ================================================= */

  .table-wrap{
    width:100%;
    max-width:100%;
    overflow:visible!important;
  }

  table{
    display:block;
    width:100%;
    max-width:100%;
    min-width:0!important;
    border-collapse:separate;
  }

  thead{
    display:none;
  }

  tbody{
    display:block;
    width:100%;
    max-width:100%;
  }

  tbody tr{
    display:block;
    width:100%;
    max-width:100%;
    margin-bottom:12px;
    padding:12px;
    border:1px solid #eceff3;
    border-radius:12px;
    background:#fff;
  }

  tbody td{
    display:grid;
    grid-template-columns:90px minmax(0,1fr);
    width:100%;
    max-width:100%;
    padding:7px 0;
    border:0;
    border-bottom:1px solid #f0f1f3;
    font-size:12px;
    line-height:1.4;
    word-break:break-word;
    overflow-wrap:anywhere;
  }

  tbody td:last-child{
    border-bottom:0;
  }

  tbody td:nth-child(1)::before{
    content:"Lead ID";
  }

  tbody td:nth-child(2)::before{
    content:"Date";
  }

  tbody td:nth-child(3)::before{
    content:"Name";
  }

  tbody td:nth-child(4)::before{
    content:"Mobile";
  }

  tbody td:nth-child(5)::before{
    content:"Requirement";
  }

  tbody td:nth-child(6)::before{
    content:"Status";
  }

  tbody td::before{
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    color:#667085;
    padding-right:8px;
  }

  .status{
    width:max-content;
    max-width:100%;
  }

  .empty{
    display:block!important;
    width:100%!important;
    padding:20px!important;
  }

}

</style>

</head>


<body>


<div class="shell">


  <!-- SIDEBAR -->

  <aside class="sidebar">


    <div class="brand">
      MADHYUM
    </div>


    <div class="role">
      Agent / Employee Portal
    </div>


    <button
      class="nav-item active"
      id="dashboardNav"
    >
      Dashboard
    </button>


    <button
      class="nav-item"
      id="addLeadNav"
    >
      Add Lead
    </button>


    <button
      class="nav-item"
      id="myLeadsNav"
    >
      My Leads
    </button>


    <button
      class="nav-item logout"
      id="logoutButton"
    >
      Logout
    </button>


    <!-- SAME PHOTO AS ADMIN SIDEBAR -->

    <div class="sidebar-banner-wrap">

      <img
        src="../images/admin-sidebar-banner.png"
        alt="MADHYUM Group"
        class="sidebar-banner"
      >

    </div>


  </aside>



  <!-- MAIN -->

  <main
    class="main"
    id="dashboardTop"
  >


    <div class="topbar">

      <div>

        <h1>
          Agent Dashboard
        </h1>

        <div
          class="agent-name"
          id="agentName"
        ></div>

      </div>

    </div>



    <div class="grid">


      <!-- ADD LEAD -->

      <section
        class="panel"
        id="addLeadSection"
      >


        <h2>
          Add New Lead
        </h2>


        <form id="leadForm">


          <div class="field">

            <label>
              Customer Name
            </label>

            <input
              id="leadName"
              type="text"
              required
            >

          </div>


          <div class="field">

            <label>
              Mobile
            </label>

            <input
              id="leadMobile"
              type="tel"
              inputmode="numeric"
              maxlength="10"
              pattern="[0-9]{10}"
              required
            >

          </div>


          <div class="field">

            <label>
              Email
            </label>

            <input
              id="leadEmail"
              type="email"
            >

          </div>


          <div class="field">

            <label>
              Requirement
            </label>


            <select
              id="leadRequirement"
              required
            >

              <option value="">
                Select Requirement
              </option>

              <option>
                Real Estate
              </option>

              <option>
                Travel
              </option>

              <option>
                Education & Admissions
              </option>

              <option>
                Consultancy & Business Services
              </option>

              <option>
                Events & Weddings
              </option>

              <option>
                Membership
              </option>

              <option>
                General / Other
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              Details
            </label>

            <textarea
              id="leadDetails"
              placeholder="Enter customer requirement..."
            ></textarea>

          </div>


          <button
            class="submit-btn"
            id="submitLeadButton"
            type="submit"
          >
            Add Lead
          </button>


          <div
            class="message"
            id="leadMessage"
          ></div>


        </form>


      </section>



      <!-- MY LEADS -->

      <section
        class="panel"
        id="myLeadsSection"
      >


        <h2>
          My Leads
        </h2>


        <div class="table-wrap">


          <table>


            <thead>

              <tr>

                <th>
                  Lead ID
                </th>

                <th>
                  Date
                </th>

                <th>
                  Name
                </th>

                <th>
                  Mobile
                </th>

                <th>
                  Requirement
                </th>

                <th>
                  Status
                </th>

              </tr>

            </thead>


            <tbody id="leadTableBody">

              <tr>

                <td
                  colspan="6"
                  class="empty"
                >
                  Loading leads...
                </td>

              </tr>

            </tbody>


          </table>


        </div>


      </section>


    </div>


  </main>


</div>



<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbwd5x_8gPAzXMeP4TZPxLQQABisZ6Zn4lmGmzhfUsg83Z4xdnNY2dqb5KdZvRhGm4M/exec";


const token =
  sessionStorage.getItem(
    "madhyumAgentToken"
  );


const agentName =
  sessionStorage.getItem(
    "madhyumAgentName"
  ) || "Agent";


if (!token){

  window.location.href =
    "index.html";

}


document
  .getElementById(
    "agentName"
  )
  .textContent =
    "Logged in as " +
    agentName;



/* LOGOUT */

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    function(){

      sessionStorage.removeItem(
        "madhyumAgentToken"
      );

      sessionStorage.removeItem(
        "madhyumAgentId"
      );

      sessionStorage.removeItem(
        "madhyumAgentName"
      );

      sessionStorage.removeItem(
        "madhyumAgentRole"
      );

      window.location.href =
        "index.html";

    }
  );



/* NAVIGATION */

document
  .getElementById(
    "dashboardNav"
  )
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "dashboardTop"
        )
        .scrollIntoView({
          behavior:"smooth"
        });

    }
  );


document
  .getElementById(
    "addLeadNav"
  )
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "addLeadSection"
        )
        .scrollIntoView({
          behavior:"smooth"
        });

    }
  );


document
  .getElementById(
    "myLeadsNav"
  )
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "myLeadsSection"
        )
        .scrollIntoView({
          behavior:"smooth"
        });

    }
  );



/* MOBILE */

document
  .getElementById(
    "leadMobile"
  )
  .addEventListener(
    "input",
    function(){

      this.value =
        this.value
          .replace(/\D/g,"")
          .slice(0,10);

    }
  );



/* SAFE HTML */

function escapeHtml(value){

  return String(
    value || ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}



/* LOAD LEADS */

async function loadMyLeads(){


  const body =
    document
      .getElementById(
        "leadTableBody"
      );


  body.innerHTML = `

    <tr>

      <td
        colspan="6"
        class="empty"
      >
        Loading leads...
      </td>

    </tr>

  `;


  try{


    const response =
      await fetch(

        API_URL +
        "?action=agentDashboard",

        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({
              token:token
            })

        }

      );


    const result =
      await response.json();


    if (!result.success){


      if (
        String(
          result.message ||
          ""
        )
        .toLowerCase()
        .includes(
          "session"
        )
      ){

        sessionStorage.clear();

        window.location.href =
          "index.html";

        return;

      }


      throw new Error(
        result.message ||
        "Unable to load leads."
      );

    }


    const leads =
      Array.isArray(
        result.leads
      )
        ? result.leads
        : [];


    if (!leads.length){

      body.innerHTML = `

        <tr>

          <td
            colspan="6"
            class="empty"
          >
            No leads added yet.
          </td>

        </tr>

      `;

      return;

    }


    body.innerHTML =

      leads
        .slice()
        .reverse()
        .map(
          function(item){

            return `

              <tr>

                <td>

                  <strong>
                    ${escapeHtml(
                      item.leadId
                    )}
                  </strong>

                </td>

                <td>
                  ${escapeHtml(
                    item.date
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    item.name
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    item.mobile
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    item.requirement
                  )}
                </td>

                <td>

                  <span class="status">
                    ${escapeHtml(
                      item.status ||
                      "NEW"
                    )}
                  </span>

                </td>

              </tr>

            `;

          }
        )
        .join("");


  } catch(error){


    body.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty"
        >
          ${escapeHtml(
            error.message ||
            "Unable to load leads."
          )}
        </td>

      </tr>

    `;

  }

}



/* ADD LEAD */

document
  .getElementById(
    "leadForm"
  )
  .addEventListener(
    "submit",
    async function(e){


      e.preventDefault();


      const message =
        document
          .getElementById(
            "leadMessage"
          );


      const button =
        document
          .getElementById(
            "submitLeadButton"
          );


      const mobile =
        document
          .getElementById(
            "leadMobile"
          )
          .value
          .trim();


      if (
        !/^[0-9]{10}$/.test(
          mobile
        )
      ){

        message.textContent =
          "Please enter a valid 10-digit mobile number.";

        return;

      }


      button.disabled =
        true;


      message.textContent =
        "Adding lead...";


      try{


        const payload = {

          token:token,

          name:
            document
              .getElementById(
                "leadName"
              )
              .value
              .trim(),

          mobile:mobile,

          email:
            document
              .getElementById(
                "leadEmail"
              )
              .value
              .trim(),

          requirement:
            document
              .getElementById(
                "leadRequirement"
              )
              .value,

          details:
            document
              .getElementById(
                "leadDetails"
              )
              .value
              .trim()

        };


        const response =
          await fetch(

            API_URL +
            "?action=addAgentLead",

            {

              method:"POST",

              headers:{
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify(
                  payload
                )

            }

          );


        const result =
          await response.json();


        if (!result.success){


          if (
            String(
              result.message ||
              ""
            )
            .toLowerCase()
            .includes(
              "session"
            )
          ){

            sessionStorage.clear();

            window.location.href =
              "index.html";

            return;

          }


          throw new Error(
            result.message ||
            "Unable to add lead."
          );

        }


        message.textContent =
          "Lead added successfully. Lead ID: " +
          result.leadId;


        document
          .getElementById(
            "leadForm"
          )
          .reset();


        await loadMyLeads();


      } catch(error){


        message.textContent =
          error.message ||
          "Unable to add lead.";


      } finally{


        button.disabled =
          false;


      }

    }
  );



/* START */

loadMyLeads();

</script>


</body>

</html>
