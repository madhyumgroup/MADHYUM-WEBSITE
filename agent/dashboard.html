<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbwd5x_8gPAzXMeP4TZPxLQQABisZ6Zn4lmGmzhfUsg83Z4xdnNY2dqb5KdZvRhGm4M/exec";


const token =
  sessionStorage.getItem("madhyumAgentToken");

const agentName =
  sessionStorage.getItem("madhyumAgentName") || "Agent";


if (!token){
  window.location.href = "index.html";
}


document.getElementById("agentName").textContent =
  "Logged in as " + agentName;


/* =========================
   LOGOUT
========================= */

document.getElementById("logoutButton")
  .addEventListener("click",function(){

    sessionStorage.removeItem("madhyumAgentToken");
    sessionStorage.removeItem("madhyumAgentId");
    sessionStorage.removeItem("madhyumAgentName");
    sessionStorage.removeItem("madhyumAgentRole");

    window.location.href = "index.html";

  });


/* =========================
   NAVIGATION
========================= */

document.getElementById("dashboardNav")
  .addEventListener("click",function(){

    document.getElementById("dashboardTop")
      .scrollIntoView({
        behavior:"smooth"
      });

  });


document.getElementById("addLeadNav")
  .addEventListener("click",function(){

    document.getElementById("addLeadSection")
      .scrollIntoView({
        behavior:"smooth"
      });

  });


document.getElementById("myLeadsNav")
  .addEventListener("click",function(){

    document.getElementById("myLeadsSection")
      .scrollIntoView({
        behavior:"smooth"
      });

  });


/* =========================
   MOBILE VALIDATION
========================= */

document.getElementById("leadMobile")
  .addEventListener("input",function(){

    this.value =
      this.value
        .replace(/\D/g,"")
        .slice(0,10);

  });


/* =========================
   SAFE HTML
========================= */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   LOAD MY LEADS
========================= */

async function loadMyLeads(){

  const body =
    document.getElementById("leadTableBody");


  body.innerHTML = `
    <tr>
      <td colspan="6" class="empty">
        Loading leads...
      </td>
    </tr>
  `;


  try{

    const response =
      await fetch(
        API_URL + "?action=agentDashboard",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:JSON.stringify({
            token:token
          })
        }
      );


    const result =
      await response.json();


    if (!result.success){

      if (
        String(result.message || "")
          .toLowerCase()
          .includes("session")
      ){

        sessionStorage.clear();

        window.location.href =
          "index.html";

        return;
      }


      throw new Error(
        result.message ||
        "Unable to load leads."
      );

    }


    const leads =
      Array.isArray(result.leads)
        ? result.leads
        : [];


    if (!leads.length){

      body.innerHTML = `
        <tr>
          <td colspan="6" class="empty">
            No leads added yet.
          </td>
        </tr>
      `;

      return;
    }


    body.innerHTML =
      leads
        .slice()
        .reverse()
        .map(function(item){

          return `
            <tr>

              <td>
                <strong>
                  ${escapeHtml(item.leadId)}
                </strong>
              </td>

              <td>
                ${escapeHtml(item.date)}
              </td>

              <td>
                ${escapeHtml(item.name)}
              </td>

              <td>
                ${escapeHtml(item.mobile)}
              </td>

              <td>
                ${escapeHtml(item.requirement)}
              </td>

              <td>
                <span class="status">
                  ${escapeHtml(item.status || "NEW")}
                </span>
              </td>

            </tr>
          `;

        })
        .join("");


  } catch(error){

    body.innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          ${escapeHtml(
            error.message ||
            "Unable to load leads."
          )}
        </td>
      </tr>
    `;

  }

}


/* =========================
   ADD LEAD
========================= */

document.getElementById("leadForm")
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const message =
        document.getElementById("leadMessage");

      const button =
        document.getElementById("submitLeadButton");


      const mobile =
        document
          .getElementById("leadMobile")
          .value
          .trim();


      if (!/^[0-9]{10}$/.test(mobile)){

        message.textContent =
          "Please enter a valid 10-digit mobile number.";

        return;
      }


      button.disabled = true;

      message.textContent =
        "Adding lead...";


      try{

        const payload = {

          token:token,

          name:
            document
              .getElementById("leadName")
              .value
              .trim(),

          mobile:mobile,

          email:
            document
              .getElementById("leadEmail")
              .value
              .trim(),

          requirement:
            document
              .getElementById("leadRequirement")
              .value,

          details:
            document
              .getElementById("leadDetails")
              .value
              .trim()

        };


        const response =
          await fetch(
            API_URL + "?action=addAgentLead",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify(payload)
            }
          );


        const result =
          await response.json();


        if (!result.success){

          if (
            String(result.message || "")
              .toLowerCase()
              .includes("session")
          ){

            sessionStorage.clear();

            window.location.href =
              "index.html";

            return;
          }


          throw new Error(
            result.message ||
            "Unable to add lead."
          );

        }


        message.textContent =
          "Lead added successfully. Lead ID: " +
          result.leadId;


        document
          .getElementById("leadForm")
          .reset();


        await loadMyLeads();


      } catch(error){

        message.textContent =
          error.message ||
          "Unable to add lead.";

      } finally{

        button.disabled = false;

      }

    }
  );


/* =========================
   START
========================= */

loadMyLeads();

</script>
