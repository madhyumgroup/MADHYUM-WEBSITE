<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MADHYUM Admin Dashboard</title>

  <style>
    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f5f7fa;
      color:#111827;
    }

    .admin-shell{
      min-height:100vh;
      display:grid;
      grid-template-columns:240px 1fr;
    }

    .sidebar{
      background:#0d1726;
      color:#fff;
      padding:24px 18px;
      min-height:100vh;
      position:sticky;
      top:0;
      align-self:start;
    }

    .brand{
      font-size:22px;
      font-weight:900;
      letter-spacing:.12em;
      margin-bottom:8px;
    }

    .role{
      font-size:12px;
      color:#aeb8c5;
      margin-bottom:32px;
    }

    .nav-item{
      display:block;
      width:100%;
      text-align:left;
      padding:12px 14px;
      border-radius:10px;
      margin-bottom:8px;
      color:#d8e0e8;
      background:transparent;
      border:0;
      cursor:pointer;
      font-size:14px;
    }

    .nav-item.active,
    .nav-item:hover{
      background:#18263a;
      color:#fff;
    }

    .logout{
      margin-top:30px;
      background:#c9a45b;
      color:#111;
      font-weight:800;
    }

    .main{
      padding:28px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:24px;
    }

    .topbar h1{
      margin:0;
      font-size:30px;
    }

    .admin-name{
      color:#667085;
      font-size:14px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:14px;
      margin-bottom:24px;
    }

    .card{
      background:#fff;
      border-radius:16px;
      padding:18px;
      box-shadow:0 8px 24px rgba(15,23,42,.06);
    }

    .card-label{
      font-size:12px;
      color:#667085;
      margin-bottom:8px;
    }

    .card-value{
      font-size:30px;
      font-weight:900;
    }

    #visitorsCard{
      scroll-margin-top:25px;
    }

    .visitor-highlight{
      outline:2px solid #c9a45b;
      outline-offset:2px;
    }

    .panel{
      background:#fff;
      border-radius:16px;
      padding:20px;
      box-shadow:0 8px 24px rgba(15,23,42,.06);
      scroll-margin-top:25px;
    }

    .panel-title{
      margin:0 0 18px;
      font-size:20px;
    }

    .filters{
      display:grid;
      grid-template-columns:1.5fr 1fr 1fr;
      gap:12px;
      margin-bottom:18px;
    }

    input,
    select{
      width:100%;
      padding:11px 12px;
      border:1px solid #d9dee5;
      border-radius:10px;
      font-size:14px;
      background:#fff;
    }

    .table-wrap{
      overflow:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:900px;
    }

    th,
    td{
      padding:12px 10px;
      border-bottom:1px solid #eceff3;
      text-align:left;
      font-size:13px;
    }

    th{
      color:#667085;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    .status{
      display:inline-block;
      padding:5px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
      background:#eef2f6;
    }

    .loading,
    .empty{
      padding:28px;
      text-align:center;
      color:#667085;
    }

    .export-message{
      margin-top:12px;
      font-size:12px;
      color:#067647;
      font-weight:700;
      min-height:18px;
    }

    @media(max-width:1000px){
      .cards{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:760px){
      .admin-shell{
        grid-template-columns:1fr;
      }

      .sidebar{
        position:relative;
        min-height:auto;
      }

      .main{
        padding:16px;
      }

      .cards{
        grid-template-columns:1fr 1fr;
      }

      .filters{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div class="admin-shell">

  <aside class="sidebar">

    <div class="brand">MADHYUM</div>

    <div class="role">
      Admin Dashboard
    </div>

    <button class="nav-item active" id="dashboardNav">
      Dashboard
    </button>

    <button class="nav-item" id="inquiriesNav">
      Inquiries
    </button>

    <button class="nav-item" id="visitorsNav">
      Visitors
    </button>

    <button class="nav-item" id="exportNav">
      Export
    </button>

    <button class="nav-item logout" id="logoutButton">
      Logout
    </button>

  </aside>


  <main class="main" id="dashboardTop">

    <div class="topbar">

      <div>
        <h1>Dashboard</h1>
        <div class="admin-name" id="adminName"></div>
      </div>

    </div>


    <section class="cards" id="dashboardCards">

      <div class="card">
        <div class="card-label">Total Inquiries</div>
        <div class="card-value" id="totalInquiries">—</div>
      </div>

      <div class="card">
        <div class="card-label">New</div>
        <div class="card-value" id="newInquiries">—</div>
      </div>

      <div class="card">
        <div class="card-label">In Progress</div>
        <div class="card-value" id="progressInquiries">—</div>
      </div>

      <div class="card">
        <div class="card-label">Closed</div>
        <div class="card-value" id="closedInquiries">—</div>
      </div>

      <div class="card" id="visitorsCard">
        <div class="card-label">Visitors</div>
        <div class="card-value" id="visitorCount">—</div>
      </div>

    </section>


    <section class="panel" id="inquiriesSection">

      <h2 class="panel-title">Inquiries</h2>

      <div class="filters">

        <input
          id="searchInput"
          type="search"
          placeholder="Search Inquiry ID, name or mobile..."
        >

        <select id="wingFilter">
          <option value="">All Wings</option>
          <option>Real Estate</option>
          <option>Travel</option>
          <option>Education & Admissions</option>
          <option>Consultancy & Business Services</option>
          <option>Events & Weddings</option>
          <option>Membership</option>
          <option>General / Other</option>
        </select>

        <select id="statusFilter">
          <option value="">All Status</option>
          <option>NEW</option>
          <option>IN PROGRESS</option>
          <option>CLOSED</option>
        </select>

      </div>


      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Inquiry ID</th>
              <th>Date</th>
              <th>Name</th>
              <th>Mobile</th>
              <th>Wing</th>
              <th>Status</th>
              <th>Source</th>
            </tr>
          </thead>

          <tbody id="inquiryTableBody">

            <tr>
              <td colspan="7" class="loading">
                Loading inquiries...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

      <div class="export-message" id="exportMessage"></div>

    </section>

  </main>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbwd5x_8gPAzXMeP4TZPxLQQABisZ6Zn4lmGmzhfUsg83Z4xdnNY2dqb5KdZvRhGm4M/exec";


const token =
  sessionStorage.getItem("madhyumAdminToken");

const adminName =
  sessionStorage.getItem("madhyumAdminName") || "Admin";


if (!token) {
  window.location.href = "index.html";
}


document.getElementById("adminName").textContent =
  "Logged in as " + adminName;


document.getElementById("logoutButton")
  .addEventListener("click", function(){

    sessionStorage.removeItem("madhyumAdminToken");
    sessionStorage.removeItem("madhyumAdminName");
    sessionStorage.removeItem("madhyumAdminRole");

    window.location.href = "index.html";

  });


let allInquiries = [];


/* -------------------------------
   SIDEBAR NAVIGATION
-------------------------------- */

const navButtons =
  document.querySelectorAll(".nav-item:not(.logout)");

function setActiveNav(button){

  navButtons.forEach(function(item){
    item.classList.remove("active");
  });

  button.classList.add("active");

}


document.getElementById("dashboardNav")
  .addEventListener("click", function(){

    setActiveNav(this);

    document.getElementById("dashboardTop")
      .scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

  });


document.getElementById("inquiriesNav")
  .addEventListener("click", function(){

    setActiveNav(this);

    document.getElementById("inquiriesSection")
      .scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

  });


document.getElementById("visitorsNav")
  .addEventListener("click", function(){

    setActiveNav(this);

    const visitorCard =
      document.getElementById("visitorsCard");

    visitorCard.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

    visitorCard.classList.add("visitor-highlight");

    setTimeout(function(){
      visitorCard.classList.remove("visitor-highlight");
    },1500);

  });


document.getElementById("exportNav")
  .addEventListener("click", function(){

    setActiveNav(this);

    exportInquiriesCSV();

  });


/* -------------------------------
   HTML SAFETY
-------------------------------- */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* -------------------------------
   INQUIRY TABLE
-------------------------------- */

function getFilteredInquiries() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const wing =
    document
      .getElementById("wingFilter")
      .value;

  const status =
    document
      .getElementById("statusFilter")
      .value;


  return allInquiries.filter(function(item) {

    const matchesSearch =
      !search ||
      String(item.inquiryId || "").toLowerCase().includes(search) ||
      String(item.name || "").toLowerCase().includes(search) ||
      String(item.mobile || "").toLowerCase().includes(search);

    const matchesWing =
      !wing ||
      item.requirement === wing;

    const matchesStatus =
      !status ||
      String(item.status || "").toUpperCase() ===
      status.toUpperCase();

    return (
      matchesSearch &&
      matchesWing &&
      matchesStatus
    );

  });

}


function renderTable() {

  const filtered =
    getFilteredInquiries();

  const body =
    document.getElementById("inquiryTableBody");


  if (!filtered.length) {

    body.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          No inquiries found.
        </td>
      </tr>
    `;

    return;
  }


  body.innerHTML =
    filtered.map(function(item) {

      return `
        <tr>

          <td>
            <strong>
              ${escapeHtml(item.inquiryId)}
            </strong>
          </td>

          <td>
            ${escapeHtml(item.date)}
          </td>

          <td>
            ${escapeHtml(item.name)}
          </td>

          <td>
            ${escapeHtml(item.mobile)}
          </td>

          <td>
            ${escapeHtml(item.requirement)}
          </td>

          <td>
            <span class="status">
              ${escapeHtml(item.status || "NEW")}
            </span>
          </td>

          <td>
            ${escapeHtml(item.source)}
          </td>

        </tr>
      `;

    }).join("");

}


/* -------------------------------
   EXPORT CSV
-------------------------------- */

function csvSafe(value){

  const text =
    String(value ?? "")
      .replace(/\r?\n/g," ");

  return '"' +
    text.replace(/"/g,'""') +
    '"';

}


function exportInquiriesCSV(){

  const message =
    document.getElementById("exportMessage");

  const data =
    getFilteredInquiries();


  if (!data.length){

    message.textContent =
      "No inquiries available to export.";

    return;
  }


  const rows = [

    [
      "Inquiry ID",
      "Date",
      "Time",
      "Name",
      "Mobile",
      "Email",
      "Wing / Requirement",
      "Details",
      "Source",
      "Status",
      "Assigned To",
      "Follow Up",
      "Notes",
      "Last Updated"
    ],

    ...data.map(function(item){

      return [
        item.inquiryId,
        item.date,
        item.time,
        item.name,
        item.mobile,
        item.email,
        item.requirement,
        item.details,
        item.source,
        item.status,
        item.assignedTo,
        item.followUp,
        item.notes,
        item.lastUpdated
      ];

    })

  ];


  const csv =
    rows
      .map(function(row){
        return row
          .map(csvSafe)
          .join(",");
      })
      .join("\n");


  const blob =
    new Blob(
      ["\uFEFF" + csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");


  const today =
    new Date()
      .toISOString()
      .slice(0,10);


  link.href = url;

  link.download =
    "MADHYUM-Inquiries-" +
    today +
    ".csv";


  document.body.appendChild(link);

  link.click();

  link.remove();

  URL.revokeObjectURL(url);


  message.textContent =
    data.length +
    " inquiries exported successfully.";


  setTimeout(function(){

    message.textContent = "";

  },3000);

}


/* -------------------------------
   LOAD DASHBOARD
-------------------------------- */

async function loadDashboard() {

  const body =
    document.getElementById("inquiryTableBody");


  body.innerHTML = `
    <tr>
      <td colspan="7" class="loading">
        Loading inquiries...
      </td>
    </tr>
  `;


  try {

    const response =
      await fetch(
        API_URL + "?action=adminDashboard",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:JSON.stringify({
            token:token
          })
        }
      );


    const result =
      await response.json();


    if (!result.success) {

      if (
        String(result.message || "")
          .toLowerCase()
          .includes("session")
      ) {

        sessionStorage.clear();

        window.location.href =
          "index.html";

        return;
      }


      throw new Error(
        result.message ||
        "Unable to load dashboard."
      );

    }


    document.getElementById("totalInquiries").textContent =
      result.stats?.total ?? 0;

    document.getElementById("newInquiries").textContent =
      result.stats?.new ?? 0;

    document.getElementById("progressInquiries").textContent =
      result.stats?.inProgress ?? 0;

    document.getElementById("closedInquiries").textContent =
      result.stats?.closed ?? 0;

    document.getElementById("visitorCount").textContent =
      result.stats?.visitors ?? 0;


    allInquiries =
      Array.isArray(result.inquiries)
        ? result.inquiries
        : [];


    renderTable();


  } catch (error) {

    body.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          ${escapeHtml(
            error.message ||
            "Unable to load dashboard."
          )}
        </td>
      </tr>
    `;

  }

}


/* FILTERS */

document.getElementById("searchInput")
  .addEventListener("input",renderTable);

document.getElementById("wingFilter")
  .addEventListener("change",renderTable);

document.getElementById("statusFilter")
  .addEventListener("change",renderTable);


loadDashboard();

</script>

</body>
</html>
