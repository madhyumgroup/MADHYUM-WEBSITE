<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MADHYUM Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1726;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .login-box {
      width: min(420px, calc(100% - 32px));
      background: #ffffff;
      border-radius: 20px;
      padding: 38px;
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    .brand {
      text-align: center;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: .12em;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d9dee5;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #c9a45b;
    }

    button {
      width: 100%;
      border: 0;
      background: #c9a45b;
      color: #111;
      padding: 13px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 850;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    #message {
      min-height: 22px;
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #067647;
    }

    .secure {
      text-align: center;
      color: #98a2b3;
      font-size: 11px;
      margin-top: 22px;
    }
  </style>
</head>

<body>

  <div class="login-box">
<div class="login-banner-wrap">
  <img
    src="../image/admin-login-banner.png"
    alt="MADHYUM Group"
    class="login-banner"
  >
</div>
    <div class="brand">MADHYUM</div>

    <div class="subtitle">
      Admin Dashboard
    </div>

    <form id="adminLoginForm">

      <label for="adminId">
        Admin ID
      </label>

      <input
        id="adminId"
        type="text"
        autocomplete="username"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Login →
      </button>

      <div id="message" aria-live="polite"></div>

    </form>

    <div class="secure">
      MADHYUM Secure Administration
    </div>

  </div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbwd5x_8gPAzXMeP4TZPxLQQABisZ6Zn4lmGmzhfUsg83Z4xdnNY2dqb5KdZvRhGm4M/exec";


const form =
  document.getElementById("adminLoginForm");

const button =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


form.addEventListener("submit", async function(e) {

  e.preventDefault();

  message.textContent = "";
  message.className = "";

  const adminId =
    document.getElementById("adminId").value.trim();

  const password =
    document.getElementById("password").value;


  if (!adminId || !password) {

    message.textContent =
      "Please enter Admin ID and password.";

    message.className =
      "error";

    return;
  }


  button.disabled = true;
  button.textContent = "Signing in…";


  try {

    const response =
      await fetch(
        API_URL + "?action=adminLogin",
        {
          method: "POST",

          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },

          body: JSON.stringify({
            adminId: adminId,
            password: password
          })
        }
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        "Login failed."
      );

    }


    sessionStorage.setItem(
      "madhyumAdminToken",
      result.token
    );

    sessionStorage.setItem(
      "madhyumAdminName",
      result.admin?.name || "Admin"
    );

    sessionStorage.setItem(
      "madhyumAdminRole",
      result.admin?.role || ""
    );


    message.textContent =
      "Login successful.";

    message.className =
      "success";


    setTimeout(function() {

      window.location.href =
        "dashboard.html";

    }, 500);


  } catch (error) {

    message.textContent =
      error.message ||
      "Unable to login.";

    message.className =
      "error";

  } finally {

    button.disabled = false;
    button.textContent = "Login →";

  }

});

</script>

</body>
</html>
